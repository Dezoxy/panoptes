---
extends: default

ignore: |
  docs/architecture/generated/
  evidence/
  node_modules/
  .venv/

rules:
  line-length:
    max: 120
    level: warning
  # GitHub workflows use bare "on:" as a key.
  truthy:
    allowed-values: ["true", "false", "on", "off", "yes", "no"]
    check-keys: false
  document-start: disable
  comments:
    min-spaces-from-content: 1
