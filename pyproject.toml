[project]
name = "panoptes-platform"
version = "0.1.0"
description = "Shared AI platform tooling for Northgate Asset Management"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Tom Horvath", email = "me@toomhorvath.com" }]
dependencies = ["typer>=0.12"]

[project.scripts]
panoptes = "panoptes_platform.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panoptes_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"gateway/tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src/panoptes_platform", "gateway/tests"]
mypy_path = "src"
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests", "gateway/tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src"]
